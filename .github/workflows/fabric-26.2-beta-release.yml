name: Build and release Fabric 26.2 beta

on:
  push:
    branches:
      - codex/fabric-native-refactor
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabric-26.2-beta-release
  cancel-in-progress: false

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release 26.2-1.0.0-beta-fabric]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --console=plain

      - name: Record checksums
        run: sha256sum build/libs/aether-26.2-fabric-1.0.0-beta*.jar

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-26.2-fabric-1.0.0-beta
          path: build/libs/aether-26.2-fabric-1.0.0-beta*.jar
          if-no-files-found: error

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: 26.2-1.0.0-beta-fabric
        run: |
          gh release create "$TAG" \
            build/libs/aether-26.2-fabric-1.0.0-beta.jar#"The Aether 26.2 Fabric beta" \
            build/libs/aether-26.2-fabric-1.0.0-beta-sources.jar#"Sources" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "The Aether - $TAG" \
            --notes-file docs/releases/26.2-1.0.0-beta-fabric.md \
            --prerelease
